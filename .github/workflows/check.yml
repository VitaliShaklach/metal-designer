name: check
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис
        run: for f in mangal/js/*.js; do node --check "$f"; done
      - name: Дымовой тест (3 режима × наборы галочек, все размеры, раскрой)
        run: node mangal/tools/smoke.js
